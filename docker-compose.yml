services:
  server:
    build:
      context: ../dance-server
      dockerfile: Dockerfile
    env_file:
      - ../dance-server/.env
    expose:
      - "3000"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
